spring.application.name=inventory
server.port=8080
server.servlet.context-path=/api

# --- datasource (inventory-db) ---
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB_NAME:inventorydb}
spring.datasource.username=${POSTGRES_DB_USER:inventoryuser}
spring.datasource.password=${POSTGRES_DB_PASSWORD:inventorysecret}
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# --- kafka ---
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:29092}
spring.kafka.client-id=inventory-service
spring.kafka.consumer.group-id=inventory-service
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.concurrency=1
spring.kafka.listener.missing-topics-fatal=false

# --- topics (created via NewTopic beans) ---
# inbox: commands from the orchestrator (order aggregateType "inventory" -> inventory.inbox.events)
kafka.topic.inbox.events.name=inventory.inbox.events
kafka.topic.inbox.events.partitions=1
kafka.topic.inbox.events.replicas=1
# outbox: results routed by Debezium (aggregateType "inventory" -> inventory.outbox.events)
kafka.topic.outbox.events.name=inventory.outbox.events
kafka.topic.outbox.events.partitions=1
kafka.topic.outbox.events.replicas=1
