spring.application.name=payment
server.port=8080
server.servlet.context-path=/api

# --- datasource (payment-db) ---
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB_NAME:paymentdb}
spring.datasource.username=${POSTGRES_DB_USER:paymentuser}
spring.datasource.password=${POSTGRES_DB_PASSWORD:paymentsecret}
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# --- kafka ---
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:29092}
spring.kafka.client-id=payment-service
spring.kafka.consumer.group-id=payment-service
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.concurrency=1
spring.kafka.listener.missing-topics-fatal=false

# --- topics (created via NewTopic beans) ---
# inbox: commands from the orchestrator (order aggregateType "payment" -> payment.inbox.events)
kafka.topic.inbox.events.name=payment.inbox.events
kafka.topic.inbox.events.partitions=1
kafka.topic.inbox.events.replicas=1
# outbox: results routed by Debezium (aggregateType "payment" -> payment.outbox.events)
kafka.topic.outbox.events.name=payment.outbox.events
kafka.topic.outbox.events.partitions=1
kafka.topic.outbox.events.replicas=1
