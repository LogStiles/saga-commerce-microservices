name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    name: Compile & unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B -DskipTests clean install

  e2e:
    name: Saga compensation e2e (docker compose + real Debezium)
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: chmod +x mvnw

      - name: Start the stack
        run: docker compose up --build -d

      - name: Wait for Debezium connectors to register
        run: |
          for i in $(seq 1 30); do
            registered=$(curl -s http://localhost:8083/connectors || echo "")
            if echo "$registered" | grep -q order-outbox-connector \
              && echo "$registered" | grep -q payment-outbox-connector \
              && echo "$registered" | grep -q inventory-outbox-connector; then
              echo "All connectors registered: $registered"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Connectors did not register in time"
          docker compose logs connect connector-setup
          exit 1

      - name: Wait for order-service to accept requests
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:8080/api/v1/orders/00000000-0000-0000-0000-000000000000; then
              echo "order-service is responding"
              exit 0
            fi
            sleep 2
          done
          echo "::error::order-service never responded"
          docker compose logs order-service
          exit 1

      - name: Run the saga compensation e2e test
        run: ./mvnw -pl e2e-tests verify -DskipITs=false

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
